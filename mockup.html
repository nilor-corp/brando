<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brando Theme - App Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. Global Styles & Variables
           ========================================================================== */
        :root {
            --container-bg-color: rgba(35, 35, 40, 0.65);
            --text-color: #f5f5f5;
            --header-font: 'Bevan', serif;
            --body-font: 'Poppins', sans-serif;
            --header-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.5);
            --primary-accent: #ffffff;
            --silver-accent: #c0c0c0;
            --glow-color: rgba(255, 255, 255, 0.1);
            --border-radius-main: 16px;
            --border-radius-inner: 12px;
            --transition-speed: 0.3s;
        }

        /* ==========================================================================
           2. Main Layout & Background
           ========================================================================== */
        body {
            color: var(--text-color);
            font-family: var(--body-font);
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }
        
        #bg-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            transform: scale(1.05);
        }
        .bg-slide.active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 1.5s ease-in-out, transform 10s linear;
        }

        .page-wrapper {
            height: 100vh;
            overflow-y: auto;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-sizing: border-box;
        }

        /* ==========================================================================
           3. Component Styling
           ========================================================================== */
        
        .app-header { text-align: center; padding: 1rem 0; }
        
        /* NEW: Title style from your splash page */
        h1 {
            font-family: var(--header-font);
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 400;
            line-height: 1;
            margin: 0 auto;
            max-width: max-content;
            position: relative;
            
            /* Glass panel effect from style.css */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            /* The text color itself */
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        
        .main-content-panel {
            background: var(--container-bg-color);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-main);
            padding: 1.5rem;
        }

        .tabs { width: 100%; }
        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            background-color: rgba(0,0,0,0.2);
            border-radius: var(--border-radius-inner);
            padding: 0.5rem;
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
            margin-bottom: 1.5rem;
        }
        .tab-nav-button {
            flex: 1;
            background: transparent;
            color: var(--silver-accent);
            border: none;
            border-radius: calc(var(--border-radius-inner) - 4px);
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all var(--transition-speed) ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
        }
        .tab-nav-button:not(.selected):hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            color: var(--primary-accent);
        }
        .tab-nav-button.selected {
            color: var(--primary-accent);
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 1px 1px 3px var(--shadow-dark), -1px -1px 3px var(--shadow-light);
            transform: translateY(-2px);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .gradio-group { display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; min-height: 0; }
        .gradio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
        .input-group { display: flex; flex-direction: column; gap: 0.75rem; }
        .label-wrapper { display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: 500; color: var(--silver-accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; padding-left: 0.25rem; }
        
        input[type="text"], textarea, .image-output, .file-upload-area {
            background-color: rgba(0,0,0,0.2);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-inner);
            padding: 0.8rem 1rem;
            font-size: 1rem;
            font-family: var(--body-font);
            transition: all var(--transition-speed) ease;
            box-shadow: none;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: rgba(255,255,255,0.3);
            background-color: rgba(0,0,0,0.3);
        }
        
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .gradio-button {
            background: rgba(10, 10, 10, 0.4);
            color: var(--silver-accent);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-inner);
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: all var(--transition-speed) ease-out;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 0 var(--glow-color);
        }
        .gradio-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -80%;
            width: 40%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            transition: left 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .gradio-button:hover::after { left: 140%; }
        .gradio-button:hover { color: var(--primary-accent); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 20px var(--glow-color); }
        .gradio-button:active { transform: scale(0.98); }
        
        .file-upload-area { min-height: 150px; }
        .file-upload-area, .gallery-item { cursor: pointer; position: relative; transition: transform 0.4s ease-out, box-shadow 0.4s ease-out; transform-style: preserve-3d; display: flex; align-items: center; justify-content: center; text-align: center; }
        .gallery-item { border: 1px solid var(--border-color); }
        .file-upload-area:hover, .gallery-item:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 20px var(--glow-color); }
        
        .image-output, .video-output { display:flex; align-items: center; justify-content: center; width: 100%; flex-grow: 1; min-height: 300px; box-sizing: border-box; overflow: hidden; background-color: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: var(--border-radius-inner); }
        .image-output img, .video-output video { display: block; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: calc(var(--border-radius-inner) - 4px); }
        .placeholder-text { color: var(--silver-accent); opacity: 0.7; padding: 1rem; word-break: break-word; }
        
        @media (max-width: 768px) {
            .page-wrapper { padding: 1rem; }
            .gradio-row, .input-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    
    <div id="bg-carousel"></div>

    <div class="page-wrapper">
        <header class="app-header">
            <h1>BRANDO</h1>
        </header>

        <main class="main-content-panel">
            <nav class="tab-nav">
                <button class="tab-nav-button selected" data-tab="tab1">Logo to Video</button>
                <button class="tab-nav-button" data-tab="tab2">Upscale</button>
            </nav>
            <div class="tabs">
                <div id="tab1" class="tab-content active"> <!-- Logo to Video Tab -->
                    <div class="gradio-row">
                        <div class="gradio-group">
                            <div class="input-row">
                                <div class="input-group">
                                    <label>Logo</label>
                                    <div class="file-upload-area">
                                        <span class="placeholder-text">Upload Logo</span>
                                        <input type="file" style="display:none;" accept="image/*">
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label>Pixel Map</label>
                                    <div class="file-upload-area">
                                        <span class="placeholder-text">Upload Map</span>
                                        <input type="file" style="display:none;" accept="image/*">
                                    </div>
                                </div>
                            </div>
                             <div class="input-group">
                                <label>Reference Images</label>
                                <div class="file-upload-area">
                                    <span class="placeholder-text">Upload References</span>
                                    <input type="file" style="display:none;" accept="image/*" multiple>
                                </div>
                            </div>
                             <div class="input-group">
                                <label for="text_prompt">Text Prompt</label>
                                <textarea id="text_prompt" rows="4"></textarea>
                            </div>
                            <button class="gradio-button">Generate Video</button>
                        </div>
                        <div class="gradio-group">
                             <div class="input-group">
                                <label>Logo Video</label>
                                <div class="video-output">
                                    <span class="placeholder-text">Video Output</span>
                                </div>
                             </div>
                        </div>
                    </div>
                </div>

                <div id="tab2" class="tab-content"> <!-- Upscale Tab -->
                     <div class="gradio-row">
                        <div class="gradio-group">
                            <div class="input-group">
                                <label>Upload Video</label>
                                <div class="file-upload-area">
                                    <span class="placeholder-text">Click to Upload Video</span>
                                    <input type="file" style="display:none;" accept="video/*">
                                </div>
                            </div>
                             <div class="input-group">
                                <label>Upscale Factor</label>
                                <select><option>2x</option><option>4x</option></select>
                            </div>
                            <button class="gradio-button">Upscale</button>
                        </div>
                        <div class="gradio-group">
                             <div class="input-group">
                                <label>Upscaled Video</label>
                                <div class="video-output">
                                    <span class="placeholder-text">Upscaled Video Output</span>
                                </div>
                             </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const imageUrls = [
                'https://images.unsplash.com/photo-1746730406177-f8562813b938?q=80&w=2672&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
                'https://plus.unsplash.com/premium_photo-1749544311043-3a6a0c8d54af?q=80&w=2670&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'
            ];
            const carouselContainer = document.getElementById('bg-carousel');
            let currentImageIndex = 0;

            function preloadImages(urls, callback) {
                let loadedCount = 0;
                urls.forEach(url => {
                    const img = new Image();
                    img.src = url;
                    img.onload = img.onerror = () => {
                        loadedCount++;
                        if (loadedCount === urls.length) {
                            callback();
                        }
                    };
                });
            }

            function setupCarousel() {
                imageUrls.forEach((url) => {
                    const slide = document.createElement('div');
                    slide.className = 'bg-slide';
                    slide.style.backgroundImage = `url(${url})`;
                    carouselContainer.appendChild(slide);
                });
                changeSlide();
                setInterval(changeSlide, 8000);
            }

            function changeSlide() {
                const slides = document.querySelectorAll('.bg-slide');
                slides.forEach(slide => slide.classList.remove('active'));
                slides[currentImageIndex].classList.add('active');
                currentImageIndex = (currentImageIndex + 1) % imageUrls.length;
            }

            preloadImages(imageUrls, setupCarousel);

            const tabButtons = document.querySelectorAll('.tab-nav-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    tabButtons.forEach(btn => btn.classList.remove('selected'));
                    button.classList.add('selected');
                    const tabId = button.getAttribute('data-tab');
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                        if (content.id === tabId) {
                            content.classList.add('active');
                        }
                    });
                });
            });

        });
    </script>
</body>
</html>
